spring:
  application:
    name: binance-fifo
  profiles:
    active: local

  datasource:
    url: jdbc:h2:file:./data/fifo;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  shell:
    interactive:
      enabled: true

binance:
  base-url: https://api.binance.com
  recv-window: 5000
  rate-limit:
    weight-per-minute: 1200
  # API credentials resolved from env vars — never hardcoded
  api-key: ${BINANCE_API_KEY:}
  api-secret: ${BINANCE_API_SECRET:}

logging:
  level:
    com.binancefifo: INFO
    org.hibernate.SQL: WARN
